general {
    after_sleep_cmd = hyprctl dispatch dpms on &&,brightness.sh -r
    before_sleep_cmd = ,brightness.sh -s && loginctl lock-session
    lock_cmd = ,lock-session.sh
    ignore_dbus_inhibit = false
}

listener {
    timeout = 250
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume  = brightnessctl -rd rgb:kbd_backlight
}

listener {
    timeout = 550
    on-timeout = loginctl lock-session
    on-resume  = loginctl unlock-session
}

listener {
    timeout = 670
    on-timeout = ,brightness.sh -s && hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on && ,brightness.sh -r
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
