general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' on && ,brightness.sh -r
    before_sleep_cmd = ,brightness.sh -s && loginctl lock-session
    lock_cmd = ,lock-session.sh
    ignore_dbus_inhibit = false
}

listener {
    timeout = 150
    on-timeout = ,brightness.sh --set 10
    on-resume = ,brightness.sh -r
}

listener {
    timeout = 300
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume  = brightnessctl -rd rgb:kbd_backlight
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 720
    on-timeout = ,brightness.sh -s && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && ,brightness.sh -r
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
