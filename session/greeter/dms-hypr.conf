# Hyprland fragment for the DMS greeter (greetd-dms-greeter-git). The greeter
# runs its own throwaway Hyprland instance; this pins input + hides the logo so
# the login screen matches the session. Deployed to the greeter's config dir.
env = DMS_RUN_GREETER,1

misc {
    disable_hyprland_logo = true
}

input {
    kb_layout = dvorak-custom
    repeat_rate = 50
    repeat_delay = 250
}
