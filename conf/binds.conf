$mainMod = SUPER
$browser = zen-twilight
$terminal = kitty
$shared_scripts = ~/.local/share/own-scripts/github/quantumfate/scripts
$hyprland_scripts = ~/.config/hypr/scripts

# Terminal
binddu=$mainMod, return, Open the Terminal, exec, uwsm app -- $terminal --class Kitty-Main
binddu=$mainMod, s, Open Kitty with Tmux Session, exec, uwsm app -- $terminal --class Tmux-Main tms
binddu=$mainMod SHIFT, return, Open the Terminal, exec, uwsm app -- $terminal --class Kitty-float
binddu=$mainMod, e, Open Editor, exec, uwsm app -- $terminal --class Neovim ranger
binddu=$mainMod, f, Open File Manager, exec, uwsm app -- $terminal --class Ranger-tui ranger
binddu=$mainMod, v, Open Audio Mixer, exec, uwsm app -- $terminal --class Wiremix-tui wiremix
binddu=$mainMod, t, Open Process Management, exec, uwsm app -- $terminal --class Btop-tui btop
binddu=$mainMod, p, Open Parui, exec, uwsm app -- $terminal --class Parui-tui parui -p=yay
binddu=$mainMod, o, Open Bluetui, exec, uwsm app -- $terminal --class Blue-tui bluetui
bind=$mainMod ALT, d, exec, hyprctl dispatch exec "uwsm-app -- zen-twilight -P Media --name zen-twilight-media --no-remote"

# Applications
binddu=$mainMod, semicolon, Close focused window, exec, $shared_scripts/wrapper/minimize.sh
binddu=$mainMod, b, Open the Browser, exec, uwsm app -- $browser
binddu=$mainMod, c, Open Calculator, exec, uwsm app -- qalculate-qt
binddu=$mainMod, m, Open Proton Pass, exec, uwsm app -- proton-pass
binddu=$mainMod, n, Open Obsidian, exec, uwsm app -- obsidian
binddu=$mainMod, r, Open Application Launcher ,exec, rofi -show drun -run-command "uwsm app -- {cmd}"

# Special Workspace
binddu=$mainMod ALT, s, Toggle Special Workspace spotify, togglespecialworkspace, spotify
binddu=$mainMod ALT, v, Toggle Special Workspace vesktop, togglespecialworkspace, vesktop

# Clipboard
bindd=$mainMod ALT, R, Open clipboard history, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Workspaces
binddu=$mainMod, TAB, Previous workspace, workspace, e-1
binddu=$mainMod SHIFT, TAB, Previous workspace, workspace, e+1
bindd=$mainMod SHIFT, S, Toggle split, togglesplit, # dwindle
bindd=$mainMod SHIFT, P, Pseudo window, pseudo, # dwindle

binddu=$mainMod, plus,         Switch to workspace 1, workspace, 1
binddu=$mainMod, bracketleft,  Switch to workspace 2, workspace, 2
binddu=$mainMod, braceleft,    Switch to workspace 3, workspace, 3
binddu=$mainMod, parenleft,    Switch to workspace 4, workspace, 4
binddu=$mainMod, ampersand,    Switch to workspace 5, workspace, 5
binddu=$mainMod, equal,        Switch to workspace 6, workspace, 6
binddu=$mainMod, parenright,   Switch to workspace 7, workspace, 7
binddu=$mainMod, braceright,   Switch to workspace 8, workspace, 8
binddu=$mainMod, bracketright, Switch to workspace 9, workspace, 9
binddu=$mainMod, asterisk,     Switch to workspace 10, workspace, 10

binddu=$mainMod SHIFT, plus,         Move focused to workspace 1,  movetoworkspace, 1
binddu=$mainMod SHIFT, bracketleft,  Move focused to workspace 2,  movetoworkspace, 2
binddu=$mainMod SHIFT, braceleft,    Move focused to workspace 3,  movetoworkspace, 3
binddu=$mainMod SHIFT, parenleft,    Move focused to workspace 4,  movetoworkspace, 4
binddu=$mainMod SHIFT, ampersand,    Move focused to workspace 5,  movetoworkspace, 5
binddu=$mainMod SHIFT, equal,        Move focused to workspace 6,  movetoworkspace, 6
binddu=$mainMod SHIFT, parenright,   Move focused to workspace 7,  movetoworkspace, 7
binddu=$mainMod SHIFT, braceright,   Move focused to workspace 8,  movetoworkspace, 8
binddu=$mainMod SHIFT, bracketright, Move focused to workspace 9,  movetoworkspace, 9
binddu=$mainMod SHIFT, asterisk,     Move focused to workspace 10, movetoworkspace, 10

# Windowmanagement
bindd=$mainMod, h, Move window focus to the left, movefocus, l
bindd=$mainMod, l, Move window focus to the right, movefocus, r
bindd=$mainMod, j, Move window focus up, movefocus, u
bindd=$mainMod, k, Move window focus down, movefocus, d

bindd=$mainMod SHIFT, h, Swap current window with the window to the left, swapwindow, l
bindd=$mainMod SHIFT, l, Swap current window with the window to the right, swapwindow, r
bindd=$mainMod SHIFT, j, Swap current window with the lower window, swapwindow, u
bindd=$mainMod SHIFT, k, Swap current window with the upper window, swapwindow, d

bindde=$mainMod CTRL, h, Rezize vertical by -10, resizeactive, -10 0
bindde=$mainMod CTRL, l, Resize vertically by 10, resizeactive,  10 0
bindde=$mainMod CTRL, j, Resize horizontally by -10, resizeactive,  0 -10
bindde=$mainMod CTRL, k, Resize horizontally by 10, resizeactive,  0  10

binddm = $mainMod ALT, mouse:272, Move a window with left click, movewindow
binddm = $mainMod ALT, mouse:273, Resize a window with right click, resizewindow

# Utility
binddu=$mainMod, PRINT, Screenshot current window, exec, $shared_scripts/wrapper/hyprshot.sh --window
binddu= , PRINT, Screenshot current output, exec, $shared_scripts/wrapper/hyprshot.sh --output
binddu=$mainMod SHIFT, PRINT, Screenshot a selected region, exec, $shared_scripts/wrapper/hyprshot.sh --region
bindd=ALT, p, Execute hyprpicker to extract hex codes,exec, hyprpicker -a -n
bindd=$mainMod ALT, l, Lock the screen, exec, hyprlock -c ~/.config/hypr-chezmoi/hyprlock.conf

# Media Control
bindd=,XF86AudioLowerVolume, Decrease the volume, exec, $shared_scripts/wrapper/volume.sh --dec
bindd=,XF86AudioRaiseVolume, Increase the volume, exec, $shared_scripts/wrapper/volume.sh --inc
bindd=,XF86AudioMute, Mute audio,exec, $shared_scripts/wrapper/volume.sh --toggle
bindd=,XF86AudioMicMute, Mute mic,exec, $shared_scripts/wrapper/volume.sh --toggle-mic
bindd=,XF86MonBrightnessDown, Decrease the brightness, exec, $shared_scripts/wrapper/brightness.sh --dec
bindd=,XF86MonBrightnessUp, Increase the brightness ,exec, $shared_scripts/wrapper/brightness.sh --inc
