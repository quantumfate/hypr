---
name: CI
on:
  push:
    branches: [main, master]
  pull_request:

# Validate-only: format, lint, and evaluate both delivery paths (nix + ansible).
# No publishing (Galaxy / cachix) until the structure stabilises.
jobs:
  # Format + lua/shell/yaml lint + ansible syntax/lint, all inside the devShell.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop --command just check-all

  # Nix delivery path: evaluate the flake (modules + devShell) end to end.
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check
