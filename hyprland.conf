# conf
source=~/.config/hypr/conf/workspaces.conf
source=~/.config/hypr/conf/animations.conf
source=~/.config/hypr/conf/windowrules.conf

## misc
source=~/.config/hypr/themes/macchiato.conf
source=~/.config/hypr/conf/misc/alt-tab.conf
source=~/.config/hypr/conf/misc/named-windowrules.conf

## conditionals
source=~/.config/hypr-chezmoi/custom-sources.conf

exec-once=~/.config/hypr/scripts/IPC/IPC_Wrapper.sh

cursor {
  no_warps=true
}
decoration {



}
decoration {
  active_opacity = 1.0
  inactive_opacity = 1.0

  blur {
    enabled = true
    size = 6              # blur kernel radius
    passes = 3            # 2 = cheap, 3 = sweet spot, 4+ = diminishing returns
    new_optimizations = true
    xray = false          # true = blur sees through ALL windows to wallpaper; false = blurs window-behind-window
    ignore_opacity = true # blur even fully-opaque regions of windows below — important for readability
    noise = 0.02          # subtle film grain hides banding
    contrast = 1.05       # slightly punch up blurred content
    brightness = 1.0
    vibrancy = 0.18       # saturation boost on blurred areas — keeps colors alive
    vibrancy_darkness = 0.0
    popups = true         # blur menus/tooltips too
    popups_ignorealpha = 0.2
  }

  shadow {
    enabled = true
    range = 30
    render_power = 5
    offset = 0 5
    color = rgba(00000070)
  }
  active_opacity=0.92
  dim_around=0.6
  dim_special=0.4
  inactive_opacity=0.85
  rounding = 12
}

general {
  snap {
    enabled=true
    monitor_gap=30
  border_overlap=false
  }
  allow_tearing=false
  border_size=2
  col.active_border=$mauve
  col.inactive_border=$crust
  gaps_in=5
  gaps_out=10
  float_gaps=-1
  layout=master
  resize_on_border=false
  no_focus_fallback=true
}

group {
  groupbar {
    enabled=true
  }
  auto_group=true
}

input {
  touchpad {
    disable_while_typing=true
  }
  follow_mouse=0
  kb_layout=dvorak-custom
  mouse_refocus=false
  sensitivity=0.200000
}

layerrule=match:namespace notifications, animation slide

master {
  new_status=master
  orientation=center
  new_on_active=after
  mfact=0.50
  center_master_fallback=right
  always_keep_position=false
  slave_count_for_center_master=2
}

misc {
  disable_hyprland_logo=true
  disable_splash_rendering=true
  focus_on_activate=true
  font_family=Hack Nerd Font Mono
  size_limits_tiled=true
  mouse_move_enables_dpms=true
}

# ==================
# WINDOW RULES
# ==================
windowrule = tile on, match:class ^(org\.wezfurlong\.wezterm)$

windowrule = rounding 12, match:class ^(org\.gnome\.)

windowrule = tile on, match:class ^(gnome-control-center)$
windowrule = tile on, match:class ^(pavucontrol)$
windowrule = tile on, match:class ^(nm-connection-editor)$

windowrule = float on, match:class ^(org\.gnome\.Calculator)$
windowrule = float on, match:class ^(gnome-calculator)$
windowrule = float on, match:class ^(galculator)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(org\.gnome\.Nautilus)$
windowrule = float on, match:class ^(xdg-desktop-portal)$

windowrule = no_initial_focus on, match:class ^(steam)$, match:title ^(notificationtoasts)
windowrule = pin on, match:class ^(steam)$, match:title ^(notificationtoasts)

windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zoom)$

# DMS windows floating by default
# ! Hyprland doesn't size these windows correctly so disabling by default here
# windowrule = float on, match:class ^(org.quickshell)$

layerrule = no_anim on, match:namespace ^(quickshell)$
layerrule = no_anim on, match:namespace ^dms:.*

source = ./dms/colors.conf
source = ./dms/outputs.conf
source = ./dms/layout.conf
source = ./dms/cursor.conf
source = ./dms/binds.conf
