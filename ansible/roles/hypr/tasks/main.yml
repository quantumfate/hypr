---
# Channel-independent tools (always from official repos).
- name: Install Hyprland tool packages
  become: true
  community.general.pacman:
    name: "{{ hypr_tool_packages }}"
    state: present
  when: hypr_install_packages | bool

# Coupled ecosystem — STABLE channel: official repos.
- name: Install hypr* ecosystem (stable channel)
  become: true
  community.general.pacman:
    name: "{{ hypr_core_packages }}"
    state: present
  when:
    - hypr_install_packages | bool
    - hypr_channel == 'stable'

# In-place swap: remove the stable coupled set first so the -git build has no
# conflicts to confirm (ansible has no TTY; --noconfirm can't remove conflicts).
# -Rdd skips dep checks and keeps reverse-dep files; only installed packages are
# passed, so this is a no-op on a fresh host. Opt-in (hypr_channel_replace_stable).
- name: Remove stable hypr* before git swap (opt-in)
  become: true
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      installed=;
      for p in {{ hypr_stable_conflicts | join(' ') }}; do
        pacman -Qq "$p" 2>/dev/null | grep -Fxq "$p" && installed="$installed $p";
      done;
      if [ -n "$installed" ]; then pacman -Rdd --noconfirm $installed; else echo "nothing to remove"; fi
    executable: /bin/bash
  register: hypr_stable_removed
  changed_when: "'nothing to remove' not in hypr_stable_removed.stdout"
  when:
    - hypr_install_packages | bool
    - hypr_channel == 'git'
    - hypr_channel_replace_stable | bool


- name: Install hypr* ecosystem (git channel, AUR)
  ansible.builtin.command:
    cmd: >-
      {{ hypr_aur_helper }} -S --needed --noconfirm --removemake \
      --answerclean y --answerdiff n --answeredit n --answerupgrade y
      {{ hypr_git_packages | join(' ') }}
  register: hypr_git_result
  changed_when: "'there is nothing to do' not in hypr_git_result.stdout | lower"
  when:
    - hypr_install_packages | bool
    - hypr_channel == 'git'

# AUR packages via the configured helper (paru/yay). community.general.pacman
# can't build AUR, so shell out to the helper as the login user (not root).
- name: Install AUR packages via helper
  ansible.builtin.command:
    cmd: "{{ hypr_aur_helper }} -S --needed --noconfirm {{ hypr_aur_packages | join(' ') }}"
  register: hypr_aur_result
  changed_when: "'there is nothing to do' not in hypr_aur_result.stdout | lower"
  when:
    - hypr_install_aur_packages | bool
    - hypr_aur_packages | length > 0

- name: Ensure the ~/.config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config"
    state: directory
    mode: "0755"

- name: Manage the config directory
  block:
    - name: Check whether the config target exists
      ansible.builtin.stat:
        path: "{{ hypr_config_dir }}"
      register: config_dir_stat

    - name: Probe the config target for uncommitted changes
      ansible.builtin.command: git -C {{ hypr_config_dir }} status --porcelain
      register: config_dir_dirty
      changed_when: false
      failed_when: false
      check_mode: false
      when: config_dir_stat.stat.exists and not config_dir_stat.stat.islnk

    - name: Abort — config target is a git checkout with uncommitted changes
      ansible.builtin.fail:
        msg: >-
          {{ hypr_config_dir }} has uncommitted changes; commit or move them
          before re-linking the config.
      when: config_dir_dirty.stdout | default('') | length > 0

    - name: Remove the old config target
      ansible.builtin.file:
        path: "{{ hypr_config_dir }}"
        state: absent
      when: config_dir_stat.stat.exists and not config_dir_stat.stat.islnk

    - name: Symlink the config into place
      ansible.builtin.file:
        src: "{{ hypr_repo_path | realpath }}"
        dest: "{{ hypr_config_dir }}"
        state: link
        force: true
      register: hypr_config_link

    - name: Reload the live hyprland config
      ansible.builtin.command: hyprctl reload
      changed_when: false
      failed_when: false
      when: hypr_config_link.changed
  when: (hypr_repo_path | realpath) != (hypr_config_dir | realpath)

# Shared Dofus state (team.json) lives in XDG_STATE_HOME and is written by both
# this config (hypr/lib/store.lua) and the quickshell UI. Seed the directory.
- name: Ensure the XDG state directory exists
  ansible.builtin.file:
    path: >-
      {{ (ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.user_dir + '/.local/state'))
         + '/dofus' }}
    state: directory
    mode: "0755"

# Deploy uwsm env + hypr* user units, then enable the units. Gated on
# hypr_deploy_session so a config-only deploy can skip it.
- name: Deploy session glue
  when: hypr_deploy_session | bool
  block:
    - name: Ensure uwsm config dir exists
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.config/uwsm"
        state: directory
        mode: "0755"

    # NVIDIA env block only survives on nvidia hosts; elsewhere comment it out so
    # the file is portable (see session/uwsm/env-hyprland).
    - name: Deploy uwsm env-hyprland (GPU block gated by hypr_gpu)
      ansible.builtin.copy:
        dest: "{{ ansible_facts.user_dir }}/.config/uwsm/env-hyprland"
        mode: "0644"
        content: |
          {% for line in lookup('file', hypr_repo_path ~ '/session/uwsm/env-hyprland').splitlines() %}
          {{ (hypr_gpu != 'nvidia' and (line is match('^export (GBM_BACKEND|__GLX_VENDOR_LIBRARY_NAME|LIBVA_DRIVER_NAME|NVD_BACKEND)='))) | ternary('# ' ~ line, line) }}
          {% endfor %}

    - name: Ensure the shared quantum-store directory exists
      # The one directory every runtime's state files live under (QF_STORE);
      # env-hyprland above exports it, and the store implementations adopt
      # anything still at the legacy locations on read.
      ansible.builtin.file:
        path: "{{ qf_store_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure systemd user dir exists
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Deploy custom hypr* user units
      ansible.builtin.copy:
        src: "{{ hypr_repo_path }}/session/systemd/{{ item }}"
        dest: "{{ ansible_facts.user_dir }}/.config/systemd/user/{{ item }}"
        mode: "0644"
      loop: "{{ hypr_custom_units }}"

    - name: Enable hypr* user units (custom + packaged)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        scope: user
      loop: "{{ hypr_custom_units + hypr_enable_units }}"
